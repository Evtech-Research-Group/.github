<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Evtech Research Group">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="0.55" stop-color="#121821"/>
      <stop offset="1" stop-color="#1a0d0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e53935" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e53935" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e53935" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e53935" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e53935" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="320" rx="14"/></clipPath>
  </defs>

  <style>
    .trace { fill: none; stroke: #e53935; stroke-width: 1.6; stroke-linecap: round; stroke-opacity: 0.55; stroke-dasharray: 6 14; animation: flow 3.5s linear infinite; }
    .trace.slow { animation-duration: 6s; stroke-opacity: 0.35; }
    .base { fill: none; stroke: #ffffff; stroke-opacity: 0.08; stroke-width: 1.6; }
    .node { fill: #e53935; animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .node.d1 { animation-delay: .6s; } .node.d2 { animation-delay: 1.2s; } .node.d3 { animation-delay: 1.8s; }
    .title { font: 800 64px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: 6px; fill: #f0f3f6; opacity: 0; animation: rise 1.1s ease-out .2s forwards; }
    .accent { fill: #e53935; }
    .tag { font: 500 22px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: 3px; fill: #8b949e; opacity: 0; animation: rise 1.1s ease-out .6s forwards; }
    .word { font: 600 26px 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; fill: #ff6b66; opacity: 0; animation: cycle 12s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .w2 { animation-delay: 3s; } .w3 { animation-delay: 6s; } .w4 { animation-delay: 9s; }
    .bar { fill: #e53935; animation: grow 1.2s ease-out .4s both; transform-box: fill-box; transform-origin: center; }
    .scanline { animation: sweep 7s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -40; } }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.25); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes cycle { 0% { opacity: 0; transform: translateY(10px); } 4% { opacity: 1; transform: translateY(0); } 21% { opacity: 1; transform: translateY(0); } 25% { opacity: 0; transform: translateY(-10px); } 100% { opacity: 0; } }
    @keyframes sweep { from { transform: translateX(-400px); } to { transform: translateX(1280px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } .w2,.w3,.w4 { opacity: 0 !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <ellipse cx="640" cy="160" rx="520" ry="200" fill="url(#glow)"/>
    <rect class="scanline" x="0" y="0" width="400" height="320" fill="url(#scan)"/>

    <!-- left circuit traces -->
    <g>
      <path class="base"  d="M0 70 H120 L160 110 H250"/>
      <path class="trace" d="M0 70 H120 L160 110 H250"/>
      <path class="base"  d="M0 160 H90 L130 200 H210 L240 230"/>
      <path class="trace slow" d="M0 160 H90 L130 200 H210 L240 230"/>
      <path class="base"  d="M0 260 H150 L190 220 H260"/>
      <path class="trace" d="M0 260 H150 L190 220 H260"/>
      <circle class="node"    cx="250" cy="110" r="4.5"/>
      <circle class="node d1" cx="240" cy="230" r="4.5"/>
      <circle class="node d2" cx="260" cy="220" r="4.5"/>
    </g>
    <!-- right circuit traces -->
    <g>
      <path class="base"  d="M1280 60 H1160 L1120 100 H1030"/>
      <path class="trace slow" d="M1280 60 H1160 L1120 100 H1030"/>
      <path class="base"  d="M1280 150 H1190 L1150 190 H1060"/>
      <path class="trace" d="M1280 150 H1190 L1150 190 H1060"/>
      <path class="base"  d="M1280 250 H1130 L1090 210 H1020"/>
      <path class="trace slow" d="M1280 250 H1130 L1090 210 H1020"/>
      <circle class="node d3" cx="1030" cy="100" r="4.5"/>
      <circle class="node"    cx="1060" cy="190" r="4.5"/>
      <circle class="node d1" cx="1020" cy="210" r="4.5"/>
    </g>

    <text class="title" x="640" y="132" text-anchor="middle">EVTECH <tspan class="accent">RESEARCH</tspan> GROUP</text>
    <rect class="bar" x="580" y="152" width="120" height="3" rx="1.5"/>
    <text class="tag" x="640" y="194" text-anchor="middle">TELL US THE PROBLEM. WE BUILD THE SOLUTION.</text>

    <text class="word w1" x="640" y="250" text-anchor="middle">&gt; Engineering R&amp;D</text>
    <text class="word w2" x="640" y="250" text-anchor="middle">&gt; Robotics &amp; Automation</text>
    <text class="word w3" x="640" y="250" text-anchor="middle">&gt; AI &amp; Machine Learning</text>
    <text class="word w4" x="640" y="250" text-anchor="middle">&gt; Electronics &amp; Embedded Systems</text>

    <rect x="0.5" y="0.5" width="1279" height="319" rx="14" fill="none" stroke="#30363d"/>
  </g>
</svg>
